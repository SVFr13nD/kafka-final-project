global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ['primary-1:7071', 'primary-2:7071', 'primary-3:7071']
        labels: {cluster: primary}
      - targets: ['secondary-1:7071', 'secondary-2:7071', 'secondary-3:7071']
        labels: {cluster: secondary}
