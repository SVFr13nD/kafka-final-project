name: Verify marketplace
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Static checks and sample contracts
        run: |
          pip install -r requirements-dev.txt
          python -m compileall -q services analytics scripts
          python -m pytest -q
          docker compose --profile tools config --quiet
          bash -n scripts/*.sh
      - name: Start complete stand
        run: bash scripts/start.sh
      - name: Demonstrate pipeline
        run: bash scripts/demo.sh
      - name: Verify TLS ACL filtering replication and alerts
        run: bash scripts/verify.sh
      - name: Save diagnostics
        if: always()
        run: |
          mkdir -p evidence
          docker compose ps -a > evidence/compose-status.txt
          docker compose logs --no-color --tail=500 > evidence/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-evidence
          path: evidence/
      - name: Stop services
        if: always()
        run: docker compose down
