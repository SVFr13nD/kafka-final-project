    - tools
  filter:
    build:
      context: filter
    volumes:
    - ./.runtime/roles/filter:/certs:ro
    - filter-state:/state
    restart: unless-stopped
    ports:
    - 127.0.0.1:8090:8090
  mirror:
    image: apache/kafka:3.9.1
    entrypoint:
    - /opt/kafka/bin/connect-mirror-maker.sh
    command:
    - /config/mirror.properties
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes:
    - ./.runtime/roles/mirror:/certs:ro
    - ./.runtime/mirror.properties:/config/mirror.properties:ro
    restart: unless-stopped
  connect:
    image: apache/kafka:3.9.1
    entrypoint:
    - /opt/kafka/bin/connect-distributed.sh
    command:
    - /config/connect.properties
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
    - ./.runtime/roles/connect:/certs:ro
    - ./.runtime/connect.properties:/config/connect.properties:ro
    - debug:/debug
    ports:
    - 127.0.0.1:8083:8083
    user: 0:0
    restart: unless-stopped
  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    volumes:
    - postgres:/var/lib/postgresql/data
    - ./db/init.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U marketplace
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  namenode:
    image: apache/hadoop:3.4.1
    hostname: namenode
    user: root
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - if [ ! -f /data/name/current/VERSION ]; then hdfs namenode -format -nonInteractive;
      fi; exec hdfs namenode
    environment:
      HADOOP_CONF_DIR: /config
      HADOOP_HEAPSIZE_MAX: '256'
    volumes:
    - ./infra/hadoop:/config:ro
    - namenode:/data
    restart: unless-stopped
    ports:
    - 127.0.0.1:9870:9870
  datanode:
    image: apache/hadoop:3.4.1
    hostname: datanode
    user: root
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - exec hdfs datanode
    environment:
      HADOOP_CONF_DIR: /config
      HADOOP_HEAPSIZE_MAX: '256'
    volumes:
    - ./infra/hadoop:/config:ro
    - datanode:/data
    restart: unless-stopped
  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    command:
    - python
    - -m
    - analytics.job
    volumes:
    - ./.runtime/roles/analytics:/certs:ro
    profiles:
    - tools
    environment:
      SPARK_LOCAL_IP: analytics
      PYTHONUNBUFFERED: '1'
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
    - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    - prometheus:/prometheus
    ports:
    - 127.0.0.1:9090:9090
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    - --data.retention=24h
    volumes:
    - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
    - 127.0.0.1:9093:9093
    restart: unless-stopped
  alert-receiver:
    build:
      context: .
      dockerfile: services/Dockerfile
    image: marketplace-python:local
    command:
    - services.alert_receiver
    volumes:
    - ./evidence:/evidence
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
      PYTHONUNBUFFERED: '1'
    ports:
    - 127.0.0.1:8080:8080
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: marketplace-demo
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana:/var/lib/grafana
    ports:
    - 127.0.0.1:3000:3000
    restart: unless-stopped
