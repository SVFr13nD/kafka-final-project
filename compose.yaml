name: marketplace
services:
  tools:
    build:
      context: .
      dockerfile: infra/tools.Dockerfile
    volumes:
    - .:/work
    profiles:
    - tools
  primary-1:
    build:
      context: .
      dockerfile: infra/kafka.Dockerfile
    image: marketplace-kafka:local
    hostname: primary-1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SSL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SSL://primary-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,CONTROLLER:SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@primary-1:9093,2@primary-2:9093,3@primary-3:9093
      KAFKA_SSL_KEYSTORE_LOCATION: /certs/primary-1.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /certs/truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*)$/$1/,DEFAULT
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_SUPER_USERS: User:admin;User:primary-1;User:primary-2;User:primary-3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
      KAFKA_OPTS: -javaagent:/opt/kafka/jmx-exporter.jar=7071:/etc/jmx.yml
    volumes:
    - ./.runtime/roles/primary-1:/certs:ro
    - primary-1:/var/lib/kafka/data
    - ./infra/monitoring/jmx.yml:/etc/jmx.yml:ro
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server primary-1:9092
        --command-config /certs/client.properties >/dev/null 2>&1
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 30s
